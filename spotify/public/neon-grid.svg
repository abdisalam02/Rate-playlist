<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c2ff" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#9d00ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00c2ff" stop-opacity="0.03"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#gridGradient)" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#05070a" />
  
  <!-- Grid -->
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Horizontal lines with glow -->
  <g filter="url(#glow)">
    <line x1="0" y1="200" x2="800" y2="200" stroke="#00c2ff" stroke-width="0.5" stroke-opacity="0.1" />
    <line x1="0" y1="400" x2="800" y2="400" stroke="#9d00ff" stroke-width="0.5" stroke-opacity="0.1" />
  </g>
  
  <!-- Vertical lines with glow -->
  <g filter="url(#glow)">
    <line x1="200" y1="0" x2="200" y2="600" stroke="#00c2ff" stroke-width="0.5" stroke-opacity="0.1" />
    <line x1="400" y1="0" x2="400" y2="600" stroke="#9d00ff" stroke-width="0.5" stroke-opacity="0.1" />
    <line x1="600" y1="0" x2="600" y2="600" stroke="#00c2ff" stroke-width="0.5" stroke-opacity="0.1" />
  </g>
  
  <!-- Light spots -->
  <g filter="url(#glow)">
    <circle cx="200" cy="200" r="1" fill="#00c2ff" fill-opacity="0.5" />
    <circle cx="400" cy="200" r="1" fill="#9d00ff" fill-opacity="0.5" />
    <circle cx="600" cy="200" r="1" fill="#00c2ff" fill-opacity="0.5" />
    
    <circle cx="200" cy="400" r="1" fill="#9d00ff" fill-opacity="0.5" />
    <circle cx="400" cy="400" r="1" fill="#00c2ff" fill-opacity="0.5" />
    <circle cx="600" cy="400" r="1" fill="#9d00ff" fill-opacity="0.5" />
  </g>
</svg> 